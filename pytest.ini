[pytest]
# Block the plugin's entry-point autoload: on Windows it must be imported only
# AFTER tests/conftest.py has registered the POSIX shims (fcntl/resource).
# conftest.py then loads it explicitly via pytest_plugins.
addopts = -p no:homeassistant --cov=custom_components/telegraf_mqtt --cov-report=term-missing --cov-fail-under=100
asyncio_mode = auto