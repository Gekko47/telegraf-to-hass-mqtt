name: pytest
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # HA 2026.6.x requires CPython >=3.14.2 (homeassistant Requires-Python).
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      # Pinned to the HA floor: this release depends on homeassistant==2026.6.4,
      # keeping CI's HA version in lockstep with hacs.json's 2026.6.x declaration.
      - run: pip install "pytest-homeassistant-custom-component==0.13.340" ruff prek mypy
      - name: Lint (ruff via prek)
        run: prek run --all-files
      - name: Type check (mypy --strict)
        run: mypy --strict custom_components
      - name: Test (100% coverage enforced via pytest.ini)
        run: pytest -q
