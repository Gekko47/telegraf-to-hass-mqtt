[project]
name = "telegraf-to-hass-mqtt"
version = "0.1.0"
description = "Home Assistant custom integration: one device per Telegraf-reported PC"
requires-python = ">=3.14"
dependencies = []  # SPEC.md non-goals: nothing beyond Home Assistant core

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.coverage.run]
source = ["custom_components/telegraf_mqtt"]

[tool.coverage.report]
fail_under = 100
show_missing = true