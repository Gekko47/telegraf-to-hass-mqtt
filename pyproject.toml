[project]
name = "telegraf-to-hass-mqtt"
# ``manifest.json`` is the canonical version surface (HACS and HA read it,
# CI's ``hassfest`` validates it). The static value here is locked to it
# by ``tests/test_placeholder.py::test_pyproject_version_matches_manifest``
# so a release that bumps one without the other fails the test gate.
version = "1.4.1"
description = "Home Assistant custom integration: one device per Telegraf-reported PC"
# Repo-wide Python floor -- HA 2026.6.x requires CPython >=3.14 (its
# ``homeassistant`` Requires-Python). Every tool surface declares the same
# floor: CI's pytest.yml pins python-version 3.14, mypy sets
# python_version = "3.14", ruff pins target-version = "py314".
requires-python = ">=3.14"
dependencies = []  # SPEC.md non-goals: nothing beyond Home Assistant core

[tool.ruff]
# Pinned explicitly rather than inferred from ``requires-python`` so the
# lint target is self-documenting. Note: ruff's parser is version-aware, so
# at this target it *accepts* 3.14-only grammar (e.g. PEP 758's
# unparenthesized ``except A, B:``) by design -- and ruff format at this
# target actively *strips* the parentheses from ``except (A, B):``. The
# package keeps the parenthesized, portable form (otherwise a hard
# SyntaxError on CPython <= 3.13), so every such clause carries a bare
# ``# fmt: skip`` directive: those parentheses are load-bearing. The
# grammar-compatibility tripwire for older interpreters lives in
# tests/test_syntax_compatibility.py (ast feature_version).
target-version = "py314"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.coverage.run]
source = ["custom_components/telegraf_mqtt"]

[tool.coverage.report]
fail_under = 100
show_missing = true

# pytest configuration.  We don't put `-n auto` into ``addopts`` so the CI
# gate remains a single deterministic run (cleaner coverage reporting, no
# pytest-xdist scheduling surprises in the gate output).  Local dev should
# opt in explicitly:
#
#   # TDD loop: sharded, no coverage
#   pytest -n auto
#
#   # Local pre-commit: sharded, with coverage
#   pytest -n auto --cov=custom_components.telegraf_mqtt
#
#   # CI / full gate: sequential, with coverage
#   pytest --cov=custom_components.telegraf_mqtt
#
# Wall-time cost on a 12-core machine with 390 tests:
#   sequential + coverage: ~3:46
#   xdist + coverage:      ~1:50
#   xdist, no coverage:    ~1:00
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pin the asyncio fixture loop scope explicitly. pytest-asyncio is flipping
# the implicit default to "function" in an upcoming release; setting it here
# both silences its PytestDeprecationWarning about the unset option and
# locks the scope so a future pytest-asyncio upgrade cannot silently
# change fixture caching behavior across the suite.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:homeassistant.*",
    "ignore::DeprecationWarning:voluptuous.*",
    "ignore::DeprecationWarning:backoff.*",
    "ignore::PendingDeprecationWarning",
    # Upstream test-plugin noise -- not a DeprecationWarning, so the
    # ``ignore::DeprecationWarning:homeassistant.*`` rule does not catch
    # it. Narrowly scoped to the aiohttp key-class hint from HA core.
    "ignore:It is recommended to use web.AppKey instances for keys.:homeassistant.components.http",
    # pytest-asyncio emits PytestDeprecationWarning (a separate class from
    # DeprecationWarning) for unset configuration options and upcoming
    # default changes. Silencing the class keeps our own code fully visible
    # to the DeprecationWarning surface while quieting framework notices.
    "ignore::pytest.PytestDeprecationWarning",
]
markers = [
    "asyncio: mark test as async (auto-applied by pytest-asyncio).",
]

[tool.mypy]
# Phase 10: strict typing gate over the integration package. The test
# suite is out of scope -- it intentionally drives untyped HA fakes and
# test doubles. Home Assistant is installed with sources; following
# imports into it would type-check HA itself, so its modules are
# imported for their types but its own findings are silenced.
python_version = "3.14"
files = ["custom_components/telegraf_mqtt"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "homeassistant.*"
follow_imports = "silent"