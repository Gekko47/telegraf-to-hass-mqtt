# Run with prek (https://github.com/j178/prek) or pre-commit:
#   prek install && prek run --all-files
# Hooks are declared locally against the project venv's toolchain so the same
# versions run locally and in CI without extra network round-trips per hook.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true